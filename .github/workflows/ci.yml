name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "feat/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned uv
        run: python -m pip install uv==0.13.7

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --python 3.11

      - name: Ruff
        run: uv run --locked --python 3.11 ruff check .

      - name: Mypy
        run: uv run --locked --python 3.11 mypy src

      - name: Tests
        run: uv run --locked --python 3.11 pytest --cov=powerops --cov-report=term-missing --cov-fail-under=90
