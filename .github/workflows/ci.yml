name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "feat/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned uv
        run: python -m pip install uv==0.13.7

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --python 3.11

      - name: Ruff
        run: uv run --locked --python 3.11 ruff check .

      - name: Mypy
        run: uv run --locked --python 3.11 mypy src

      - name: Tests
        run: uv run --locked --python 3.11 pytest --cov=powerops --cov-report=term-missing --cov-fail-under=90
