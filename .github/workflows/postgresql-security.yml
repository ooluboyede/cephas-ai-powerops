name: PostgreSQL Security Gates 1E–1I

on:
  workflow_dispatch:
  push:
    branches:
      - security/revenue-assurance-gate-0.1
    paths:
      - .github/workflows/postgresql-security.yml
      - migrations/postgresql/**
      - tests/postgresql/**

permissions:
  contents: read

jobs:
  postgres-rls:
    name: PostgreSQL ${{ matrix.postgres }} migration and RLS tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      POWEROPS_TEST_PASSWORD: Gate1E-Disposable-Only-ChangeMe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run disposable PostgreSQL migration and baseline RLS smoke tests
        run: bash tests/postgresql/run_gate1e.sh

      - name: Run Gate 1F adversarial scope, ACL and lifecycle tests
        run: bash tests/postgresql/run_gate1f.sh

      - name: Run Gate 1G session identity and retirement fencing tests
        run: bash tests/postgresql/run_gate1g.sh

      - name: Install PgBouncer
        run: |
          sudo apt-get install --yes pgbouncer
          pgbouncer --version

      - name: Run Gate 1H PgBouncer transaction-pool isolation tests
        run: bash tests/postgresql/run_gate1h_pgbouncer.sh

      - name: Run Gate 1I credential rotation and stale-session fencing tests
        run: bash tests/postgresql/run_gate1i_credential_rotation.sh
