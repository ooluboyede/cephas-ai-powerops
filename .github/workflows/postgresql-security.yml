name: PostgreSQL Security Gate 1G

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "security/**"

permissions:
  contents: read

jobs:
  postgres-rls:
    name: PostgreSQL ${{ matrix.postgres }} migration and adversarial tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      POWEROPS_TEST_PASSWORD: Gate1E-Disposable-Only-ChangeMe
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install PostgreSQL client and record runner context
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql --version
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
          bash --version | head -n 1

      - name: Run Gate 1E, Gate 1F and Gate 1G with trace
        run: |
          set -o pipefail
          bash -x tests/postgresql/run_gate1g.sh 2>&1 | tee "gate1g-postgres-${{ matrix.postgres }}.log"

      - name: Upload PostgreSQL diagnostic log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate1g-postgres-${{ matrix.postgres }}-diagnostic
          path: gate1g-postgres-${{ matrix.postgres }}.log
          if-no-files-found: warn
          retention-days: 14
