name: PowerOps Revenue Assurance Gates 0.1–0.2

on:
  workflow_dispatch:
  push:
    branches:
      - security/revenue-assurance-gate-0.1
    paths:
      - .github/workflows/revenue-assurance-gate-0.1.yml
      - src/**
      - tests/**
      - migrations/**
      - docs/**
      - pyproject.toml
      - uv.lock
      - requirements-*.txt

permissions:
  contents: read

jobs:
  application-and-postgres:
    name: Python quality and PostgreSQL ${{ matrix.postgres }} scope and pool tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      POWEROPS_TEST_PASSWORD: Gate1E-Disposable-Only-ChangeMe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned uv
        run: python -m pip install uv==0.13.7

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --python 3.11

      - name: Install pinned OIDC JWT verifier
        run: uv pip install --python .venv/bin/python -r requirements-auth.txt

      - name: Install optional PostgreSQL driver
        run: uv pip install --python .venv/bin/python -r requirements-postgres.txt

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Mypy
        run: .venv/bin/mypy src

      - name: Identity broker focused tests
        run: .venv/bin/pytest -q tests/test_identity_broker.py

      - name: Human database session focused tests
        run: .venv/bin/pytest -q tests/test_human_sessions.py

      - name: PostgreSQL certificate connector focused tests
        run: .venv/bin/pytest -q tests/test_postgres_certificate_connector.py

      - name: Human session issuer focused tests
        run: .venv/bin/pytest -q tests/test_human_session_issuer.py

      - name: Python tests
        run: .venv/bin/pytest

      - name: PostgreSQL revocation adapter and audit focused tests
        run: .venv/bin/pytest -q tests/test_postgres_session_revocation.py tests/test_postgres_session_revocation_audit.py tests/test_session_revocation_composition.py

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run existing PostgreSQL 0.1.1 baseline and RLS gate
        run: bash tests/postgresql/run_gate1e.sh

      - name: Run Revenue Assurance domain schema and isolation tests
        run: bash tests/postgresql/run_revenue_assurance_schema.sh

      - name: Run Gate 0.5.14.1 human actor identity foundation
        run: bash tests/postgresql/run_gate0_5_14_1.sh

      - name: Run Gate 0.5.14.4 finance maker/verifier entitlements
        run: bash tests/postgresql/run_gate0_5_14_4.sh

      - name: Run Gate 0.5.14.5 database-derived finance actors
        run: bash tests/postgresql/run_gate0_5_14_5.sh

      - name: Run Gate PS-02.1A.3 and PS-02.1A.5 per-session identity and backend registry tests
        run: bash tests/postgresql/run_gate0_5_14_8_6_ps021a3.sh

      - name: Run Gate PS-02.1A.7 append-only revocation audit integration test
        env:
          POWEROPS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash tests/postgresql/run_gate0_5_14_8_6_ps021a7.sh

      - name: Run Gate PS-02.1A.8 live PostgreSQL principal separation
        run: bash tests/postgresql/run_gate0_5_14_8_6_ps021a8.sh

      # Migration 0013 remains incompatible with the dedicated session-role model
      # and is intentionally not applied. PS-02.1A.5 uses additive migration 0015,
      # with exact-session registration/revocation tests on PostgreSQL 14–17.
      # Backend-control privileges still require customer DBA approval.
      - name: Run PostgreSQL repository integration tests
        env:
          POWEROPS_TEST_DATABASE_URL: postgresql://pwr_gate1e_bu_a1:Gate1E-Disposable-Only-ChangeMe@127.0.0.1:5432/postgres
          POWEROPS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: .venv/bin/pytest tests/test_postgres_repository.py
